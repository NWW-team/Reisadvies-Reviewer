name: Corpus ophalen

# De Claude Code-omgeving waarin dit project wordt ontwikkeld zit achter een netwerk-allowlist
# die alleen GitHub en de package-registries doorlaat. Een Actions-runner heeft wel gewone
# internettoegang, dus het ophalen van de open data gebeurt hier, en het resultaat wordt naar
# de repo gecommit. Daarmee is het corpus voor iedereen (en voor de bulkslag) beschikbaar, en
# staat de lijst in de tool nooit meer dan een dag achter op de website zelf.

on:
  workflow_dispatch:
    inputs:
      landen:
        description: 'ISO-codes, spatiegescheiden. Leeg = alle 227.'
        required: false
        default: ''
  schedule:
    # Elke ochtend, niet meer alleen op maandag: een advies dat vandaag wijzigt, staat dan
    # morgenochtend in de tool in plaats van pas volgende week. 06.00 UTC is 08.00 uur Nederlandse
    # zomertijd en 07.00 uur wintertijd -- cron kent geen tijdzones, dus dat verschuift zelf mee
    # met de klok. Naast deze dagelijkse ronde kan een redacteur in de tool ook één land rechtstreeks
    # verversen met de knop "Dit advies verversen"; deze ronde ververst alle 227 in één keer.
    - cron: '0 6 * * *'
  push:
    # workflow_dispatch telt pas mee zodra deze workflow op de default branch staat. Tot die
    # tijd is een marker in de commitboodschap de manier om hem bewust te starten.
    branches: ['claude/**']

permissions:
  contents: write

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ophalen:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[corpus]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # De Nederlandse vertegenwoordigingen: ambassades, consulaten-generaal en hun standplaats.
      # Die staan op de site goed gespeld en zijn daarmee bruikbaar voor de schrijfwijzetoets.
      - name: Vertegenwoordigingen ophalen
        run: |
          echo '### Vertegenwoordigingen' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/fetch-posten.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Reisadviezen ophalen
        run: node scripts/fetch-corpus.mjs ${{ github.event.inputs.landen }}

      - name: Samenvatting tonen
        run: |
          echo '### Ophaalrapport' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/ophaalrapport.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Bestanden: $(ls data/corpus | wc -l)"

      # De goedgekeurde woorden en namen uit SpellingSpeurneus, het spellingtooltje van de redactie.
      # Wat een collega daar goedkeurt (of als verkeerd gespelde naam aanwijst), staat zo de
      # volgende ochtend ook in deze tool. Mislukt het, dan blijft de lijst van gisteren staan.
      - name: SpellingSpeurneus ophalen
        run: |
          echo '### SpellingSpeurneus' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/haal-speurneus.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Pagina en site opnieuw bouwen, zodat de lijst ook in de gepubliceerde tool zit. Vóór de
      # bulkslag: die leest dist/app.html en hoort dezelfde regels te gebruiken.
      - name: Pagina en site bouwen
        run: node scripts/bouw-pagina.mjs && node scripts/bouw-site.mjs

      - name: Bulkslag draaien
        run: node scripts/bulk.mjs || true

      - name: Lijst voor de gepubliceerde pagina bijwerken
        run: node scripts/bouw-adviezen.mjs || true

      - name: Corpus terugcommitten
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ docs/adviezen/ docs/index.html dist/ regels/
          if git diff --staged --quiet; then
            echo 'Geen wijzigingen in het corpus.'
          else
            git commit -m "Corpus bijwerken ($(ls data/corpus | wc -l) reisadviezen)"
            git push
          fi
