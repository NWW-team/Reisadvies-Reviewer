name: Probe opendata

# Tijdelijk. Beantwoordt één vraag: kan een Actions-runner bij de open data v2 API, en hoe ziet
# een respons eruit? De ontwikkelomgeving kan de host niet bereiken, dus de adapter is geschreven
# zonder de echte vorm te kennen. Zodra die vorm bekend is en in tests/adapter.test.mjs staat,
# kan deze workflow weg.

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eén reisadvies ophalen en de structuur tonen
        run: node scripts/probe.mjs CZE
