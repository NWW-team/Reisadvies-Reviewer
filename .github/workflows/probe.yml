name: Probe opendata

# Tijdelijk. Beantwoordt één vraag: kan een Actions-runner bij de open data v2 API, en hoe ziet
# een respons eruit? De ontwikkelomgeving kan de host niet bereiken, dus de adapter is geschreven
# zonder de echte vorm te kennen. Zodra die vorm bekend is en in tests/adapter.test.mjs staat,
# kan deze workflow weg.

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eén reisadvies ophalen en de structuur tonen
        run: node scripts/probe.mjs CZE

      - name: Voorbeeldrespons terugcommitten
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/voorbeeld/
          if git diff --staged --quiet; then
            echo 'Voorbeeld ongewijzigd.'
          else
            git commit -m 'Voorbeeldrespons van de open data API vastleggen'
            git push
          fi
